# База данных системы. Сборщик работает на стороне Windows (российский IP,
# без VPN WSL) и пишет в неё через опубликованный порт 5433.
services:
  db:
    image: postgres:16
    container_name: pcb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pcb
      POSTGRES_PASSWORD: pcb
      POSTGRES_DB: pcb
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pcb-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/views.sql:/docker-entrypoint-initdb.d/02-views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcb -d pcb"]
      interval: 5s
      retries: 10

  # Просмотр базы в браузере: http://localhost:8791
  # (сервер db, пользователь pcb, пароль pcb, база pcb)
  adminer:
    image: adminer:latest
    container_name: pcb-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    ports:
      - "127.0.0.1:8791:8080"
    depends_on:
      - db

  # Сайт и API подбора: http://localhost:8792 (документация API — /docs).
  # Базе не нужен: работает по выгрузке каталога. Локально код и каталог подключены томами —
  # правки видны без пересборки образа; на сервере — то, что запечено в образ.
  api:
    build: { context: ., dockerfile: api/Dockerfile }
    image: pcb-api
    container_name: pcb-api
    restart: unless-stopped
    command:
      [
        "uvicorn",
        "api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/api",
        "--reload-dir",
        "/app/collector",
      ]
    ports:
      - "127.0.0.1:8792:8000"
    env_file:
      - .env
    volumes:
      - ./api:/app/api:ro
      - ./collector:/app/collector:ro
      - ./web:/app/web:ro

volumes:
  pcb-data:
